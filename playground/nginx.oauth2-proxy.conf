map $http_upgrade $connection_upgrade { # to handle WebSocket upgrades
   default upgrade;
   '' close;
}

server { 
   listen 8501;
   listen  [::]:8501;
   server_name playground;

   absolute_redirect off;

   error_page   404  /404.html;

   # oauth2-proxy auth subrequest: returns X-Auth-Request-Email on the response.
   # Required because oauth2-proxy does not inject user headers on WebSocket upstream requests.
   location = /oauth2/auth {
      internal;
      proxy_pass http://127.0.0.1:4180/oauth2/auth;
      proxy_set_header Host $http_host;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Uri $request_uri;
      proxy_set_header X-Forwarded-Method $request_method;
      proxy_set_header Content-Length "";
      proxy_pass_request_body off;
   }

   location /_event {
      auth_request /oauth2/auth;
      error_page 401 = @oauth2_signin;
      auth_request_set $auth_email $upstream_http_x_auth_request_email;
      auth_request_set $auth_user $upstream_http_x_auth_request_user;
      auth_request_set $auth_authorization $upstream_http_authorization;
      auth_request_set $auth_access_token $upstream_http_x_auth_request_access_token;

      proxy_pass http://127.0.0.1:8500;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
      proxy_set_header X-Auth-Request-Email $auth_email;
      proxy_set_header Authorization $auth_authorization;
      proxy_set_header X-Forwarded-Id-Token $auth_authorization;

   }

   location /ping {
      proxy_pass http://127.0.0.1:8500;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
   }

   location /_upload {
      auth_request /oauth2/auth;
      error_page 401 = @oauth2_signin;
      auth_request_set $auth_email $upstream_http_x_auth_request_email;
      auth_request_set $auth_authorization $upstream_http_authorization;

      proxy_pass http://127.0.0.1:8500;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $auth_authorization;
      proxy_set_header X-Forwarded-Id-Token $auth_authorization;

   }

   location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
   }

   location @oauth2_signin {
      return 302 /oauth2/sign_in?rd=$request_uri;
   }
}
