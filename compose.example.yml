name: opengatellm

services:
  api:
    image: ghcr.io/etalab-ia/opengatellm/api:latest
    restart: always
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - "${CONFIG_FILE:-./config.yml}:/config.yml:ro"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1" ]
      interval: 4s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      openfga:
        condition: service_healthy

  playground:
    image: ghcr.io/etalab-ia/opengatellm/playground:latest
    environment:
      - "OPENGATELLM_URL=${OPENGATELLM_URL:-http://api:8000}"
      - "REDIS_HOST=redis"
      - "REDIS_PORT=${REDIS_PORT:-6379}"
    ports:
      - "${PLAYGROUND_PORT:-8501}:8501"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8501/ping || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  openfga-init-db:
    image: postgres:16.5
    environment:
      - "PGPASSWORD=${POSTGRES_PASSWORD:-changeme}"
    entrypoint:
      - sh
      - -c
      - >
        psql -h postgres -U ${POSTGRES_USER:-postgres} -d postgres -tc
        "SELECT 1 FROM pg_database WHERE datname = 'openfga'" | grep -q 1
        || psql -h postgres -U ${POSTGRES_USER:-postgres} -d postgres -c "CREATE DATABASE openfga"
    depends_on:
      postgres:
        condition: service_healthy

  openfga-migrate:
    image: openfga/openfga:v1.20.0
    environment:
      - "OPENFGA_DATASTORE_ENGINE=postgres"
      - "OPENFGA_DATASTORE_URI=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/openfga?sslmode=disable"
    command: migrate
    restart: on-failure
    depends_on:
      openfga-init-db:
        condition: service_completed_successfully

  openfga:
    image: openfga/openfga:v1.20.0
    restart: always
    environment:
      - "OPENFGA_DATASTORE_ENGINE=postgres"
      - "OPENFGA_DATASTORE_URI=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/openfga?sslmode=disable"
      - "OPENFGA_AUTHN_METHOD=preshared"
      - "OPENFGA_AUTHN_PRESHARED_KEYS=${OPENFGA_API_TOKEN:-changeme}"
      - "OPENFGA_LOG_FORMAT=json"
    command: run
    ports:
      - "${OPENFGA_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081" ]
      interval: 4s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16.5
    restart: always
    user: postgres
    environment:
      - "POSTGRES_USER=${POSTGRES_USER:-postgres}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}"
      - "POSTGRES_DB=postgres"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-U", "postgres" ]
      interval: 4s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis/redis-stack-server:7.4.0-v7
    restart: always
    environment:
      REDIS_ARGS: "--dir /data --requirepass ${REDIS_PASSWORD:-changeme} --user ${REDIS_USER:-redis} on >password ~* allcommands --save 60 1 --appendonly yes"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 4s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres:
  redis:
