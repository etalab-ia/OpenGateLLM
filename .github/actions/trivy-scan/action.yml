name: Trivy scan
description: Scan a local image with Trivy, report the HIGH findings and fail on the CRITICAL ones.
inputs:
  image-ref:
    description: The image to scan, loaded in the local Docker daemon.
    required: true
runs:
  using: composite
  steps:
    - name: Trivy scan (HIGH — warning)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image-ref }}
        format: table
        severity: HIGH
        exit-code: "0"
        trivyignores: .github/.trivyignore

    - name: Trivy scan (CRITICAL — blocking)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image-ref }}
        format: table
        severity: CRITICAL
        exit-code: "1"
        trivyignores: .github/.trivyignore
