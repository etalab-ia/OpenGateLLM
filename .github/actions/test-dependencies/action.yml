name: Test dependencies
description: Install uv and the locked dependencies the tests need, into .venv.
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Install test dependencies
      shell: bash
      run: uv sync --locked --no-install-project --extra api --extra dev --extra test
