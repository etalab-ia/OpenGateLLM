name: Test dependencies
description: Install uv and the locked dependencies the tests need, into .venv.
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

    - name: Install test dependencies
      shell: bash
      run: uv sync --locked --no-install-project --extra api --extra dev --extra test
