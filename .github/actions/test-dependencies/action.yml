name: Test dependencies
description: Install uv and the locked dependencies the tests need, into .venv.
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

    - name: Install test dependencies
      shell: bash
      run: uv sync --locked --no-install-project --extra api --extra dev --extra test
