name: Test dependencies
description: Install uv and the locked dependencies the tests need, into .venv.
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

    - name: Install test dependencies
      shell: bash
      run: uv sync --locked --no-install-project --extra api --extra dev --extra test
