name: Test dependencies
description: Install uv and the locked dependencies the tests need, into .venv.
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

    - name: Install test dependencies
      shell: bash
      run: uv sync --locked --no-install-project --extra api --extra dev --extra test
