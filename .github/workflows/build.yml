name: Build and scan images

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
     - main
  release:
    types:
      - published
      - edited
  workflow_dispatch:

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    # Builds triggered by a PR commit wait here for a manual approval from the GitHub Actions UI
    # (configure required reviewers on the "build-approval" environment in repo settings).
    # Builds triggered by push/release/workflow_dispatch use the unprotected "build-auto" environment
    # and therefore run immediately, exactly like before.
    environment: ${{ github.event_name == 'pull_request' && 'build-approval' || 'build-auto' }}
    outputs:
      image_tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - name: Determine image tag
        id: set_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG_NAME"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            TAG="$HEAD_REF"
          else
            TAG="latest"
          fi
          # Docker tags can't contain "/", which commonly appears in branch names.
          TAG="$(echo "$TAG" | tr '/' '-')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-opengatellm-api:
    name: Build and push OpenGateLLM API image
    runs-on: ubuntu-latest
    needs: prepare
    env:
      API_IMAGE_NAME: ghcr.io/etalab-ia/opengatellm/api
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
    outputs:
      commit_title: ${{ steps.get_head_commit_title.outputs.title }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - id: get_head_commit_title
        run: echo "title=$(git log --format=%B -n 1 HEAD | head -n 1)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push OpenGateLLM API image to GitHub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          build-args: BUILD_TARGET=api
          platforms: linux/amd64
          push: true
          tags: ${{ env.API_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.API_IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.API_IMAGE_NAME }}:cache,mode=max

  build-opengatellm-playground:
    name: Build and push OpenGateLLM playground image
    runs-on: ubuntu-latest
    needs: prepare
    env:
      GITHUB_PLAYGROUND_IMAGE_NAME: ghcr.io/etalab-ia/opengatellm/playground
      GITLAB_PLAYGROUND_IMAGE_NAME: registry.gitlab.com/${{ secrets.GITLAB_PROJECT_PATH }}/playground
      PLAYGROUND_URL: https://albert.playground.env.etalab.gouv.fr
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push OpenGateLLM playground image to GitHub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./playground/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.GITHUB_PLAYGROUND_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.GITHUB_PLAYGROUND_IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.GITHUB_PLAYGROUND_IMAGE_NAME }}:cache,mode=max

  build-albert-playground:
    name: Build and push Albert playground image
    runs-on: ubuntu-latest
    needs: prepare
    env:
      GITHUB_PLAYGROUND_IMAGE_NAME: ghcr.io/etalab-ia/opengatellm/playground
      GITLAB_PLAYGROUND_IMAGE_NAME: registry.gitlab.com/${{ secrets.GITLAB_PROJECT_PATH }}/playground
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
    strategy:
      matrix:
        environment: [dev, staging, prod]
        include:
          - environment: dev
            public_url: https://albert.playground.dev.etalab.gouv.fr
            private_url: http://albert.api.001.dev.etalab.gouv.fr:8002
          - environment: staging
            public_url: https://albert.playground.staging.etalab.gouv.fr
            private_url: http://albert.api.001.staging.etalab.gouv.fr:8002

          - environment: prod
            public_url: https://albert.playground.etalab.gouv.fr
            private_url: http://albert.api.private.etalab.gouv.fr:8002

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Log in to GitLab Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_USERNAME }}
          password: ${{ secrets.GITLAB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Albert public playground images to GitLab
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            REFLEX_BACKEND_URL=${{ matrix.public_url }}
            REFLEX_FRONTEND_URL=${{ matrix.public_url }}
            CONFIG_FILE=.github/assets/playground.config.yml
            PLAYGROUND_DISABLED_PAGES=[roles,users,organizations,routers,providers]
            FAVICON=.github/assets/logo.svg
            LOGO=.github/assets/logo.svg
          file: ./playground/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.GITLAB_PLAYGROUND_IMAGE_NAME }}/${{ matrix.environment }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.GITHUB_PLAYGROUND_IMAGE_NAME }}:cache

      - name: Build and push Albert private playground images to GitLab
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            REFLEX_BACKEND_URL=${{ matrix.private_url }}
            REFLEX_FRONTEND_URL=${{ matrix.private_url }}
            CONFIG_FILE=.github/assets/playground.config.yml
            PLAYGROUND_DISABLED_PAGES=[]
            FAVICON=.github/assets/logo.svg
            LOGO=.github/assets/logo.svg
          file: ./playground/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.GITLAB_PLAYGROUND_IMAGE_NAME }}/${{ matrix.environment }}:${{ env.IMAGE_TAG }}.private
          cache-from: type=registry,ref=${{ env.GITHUB_PLAYGROUND_IMAGE_NAME }}:cache

  trivy-scan-api:
    name: Trivy scan — API
    needs: [ prepare, build-opengatellm-api ]
    uses: ./.github/workflows/trivy-scan.yml
    with:
      image-name: ghcr.io/etalab-ia/opengatellm/api
      image-tag: ${{ needs.prepare.outputs.image_tag }}

  trivy-scan-playground:
    name: Trivy scan — Playground
    needs: [ prepare, build-opengatellm-playground ]
    uses: ./.github/workflows/trivy-scan.yml
    with:
      image-name: ghcr.io/etalab-ia/opengatellm/playground
      image-tag: ${{ needs.prepare.outputs.image_tag }}

  deploy-dev:
    # Only chain automatically into the deploy workflow for the pre-existing, auto-triggered flow
    # (push to main). Builds approved manually from a PR are not deployed automatically.
    if: github.event_name == 'push'
    name: Deploy to dev
    needs:
      - build-opengatellm-api
      - trivy-scan-api
      - build-opengatellm-playground
      - trivy-scan-playground
      - build-albert-playground
    uses: ./.github/workflows/deploy.yml
    with:
      commit_title: ${{ needs.build-opengatellm-api.outputs.commit_title }}
    secrets:
      GITLAB_CI_TOKEN: ${{ secrets.GITLAB_CI_TOKEN }}
