name: Build and scan images

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
     - main
  release:
    types:
      - published
      - edited
  workflow_dispatch:

env:
  IMAGE_TAGS: |
    type=raw,value=latest,enable=${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
    type=ref,event=pr
    type=ref,event=tag
    type=sha,format=long,enable=${{ github.event_name == 'push' || github.event_name == 'release' }}
  DOCKER_METADATA_PR_HEAD_SHA: true

jobs:
  prepare:
    name: Prepare build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # The jobs that build or test need this one for its environment: build-approval makes pull request builds wait for a reviewer.
    environment: ${{ github.event_name == 'pull_request' && 'build-approval' || 'build-auto' }}
    steps:
      - name: Build approved
        run: echo "Build approved."

  build-opengatellm:
    name: Build and push OpenGateLLM ${{ matrix.image }} image
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: ./api/Dockerfile
            build_args: BUILD_TARGET=api
          - image: playground
            dockerfile: ./playground/Dockerfile
    env:
      IMAGE_NAME: ghcr.io/etalab-ia/opengatellm/${{ matrix.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAGS }}
          flavor: latest=false

      - name: Build OpenGateLLM ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:cache

      - name: Scan OpenGateLLM ${{ matrix.image }} image with Trivy (HIGH — warning)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: HIGH
          exit-code: "0"
          trivyignores: .github/.trivyignore

      - name: Scan OpenGateLLM ${{ matrix.image }} image with Trivy (CRITICAL — blocking)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          trivyignores: .github/.trivyignore

      - name: Push OpenGateLLM ${{ matrix.image }} image to GitHub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:cache,mode=max

  build-albert-playground:
    name: Build and push Albert ${{ matrix.type }} playground image (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: prepare
    env:
      GITHUB_PLAYGROUND_IMAGE_NAME: ghcr.io/etalab-ia/opengatellm/playground
      GITLAB_PLAYGROUND_IMAGE_NAME: registry.gitlab.com/${{ secrets.GITLAB_PROJECT_PATH }}/playground
    strategy:
      matrix:
        include:
          - environment: dev
            type: public
            playground_host: albert.playground.dev.etalab.gouv.fr
            reflex_url: https://albert.playground.dev.etalab.gouv.fr
            tag_suffix: ""
          - environment: dev
            type: private
            playground_host: albert.playground.dev.etalab.gouv.fr
            reflex_url: http://albert.api.001.dev.etalab.gouv.fr:8002
            tag_suffix: .private
          - environment: staging
            type: public
            playground_host: albert.playground.staging.etalab.gouv.fr
            reflex_url: https://albert.playground.staging.etalab.gouv.fr
            tag_suffix: ""
          - environment: staging
            type: private
            playground_host: albert.playground.staging.etalab.gouv.fr
            reflex_url: http://albert.api.001.staging.etalab.gouv.fr:8002
            tag_suffix: .private
          - environment: prod
            type: public
            playground_host: albert.playground.etalab.gouv.fr
            reflex_url: https://albert.playground.etalab.gouv.fr
            tag_suffix: ""
          - environment: prod
            type: private
            playground_host: albert.playground.etalab.gouv.fr
            reflex_url: http://albert.api.001.prod.etalab.gouv.fr:8002
            tag_suffix: .private

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log in to GitLab Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_USERNAME }}
          password: ${{ secrets.GITLAB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Decrypt and render playground config
        env:
          VAULT_KEY: ${{ secrets.VAULT_KEY }}
          AUTH_SSO_CLIENT_SECRET: ${{ secrets.AUTH_SSO_CLIENT_SECRET }}
          PLAYGROUND_TYPE: ${{ matrix.type }}
          PLAYGROUND_HOST: ${{ matrix.playground_host }}
        run: |
          uvx --from ansible-core==2.21.4 ansible-vault decrypt \
            --vault-password-file <(printf '%s' "$VAULT_KEY") \
            .github/assets/config.playground.yml.j2
          uv run --no-project --with jinja2==3.1.6 python - <<'PY'
          import os
          from jinja2 import StrictUndefined, Template

          with open(".github/assets/config.playground.yml.j2") as file:
              template = Template(file.read(), undefined=StrictUndefined)
          with open(".github/assets/config.playground.yml", "w") as file:
              file.write(template.render(
                  playground_type=os.environ["PLAYGROUND_TYPE"],
                  playground_host=os.environ["PLAYGROUND_HOST"],
                  auth_sso_client_secret=os.environ["AUTH_SSO_CLIENT_SECRET"],
              ) + "\n")
          PY

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GITLAB_PLAYGROUND_IMAGE_NAME }}/${{ matrix.environment }}
          tags: ${{ env.IMAGE_TAGS }}
          flavor: |
            latest=false
            suffix=${{ matrix.tag_suffix }},onlatest=true

      - name: Build Albert playground image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            REFLEX_BACKEND_URL=${{ matrix.reflex_url }}
            REFLEX_FRONTEND_URL=${{ matrix.reflex_url }}
            CONFIG_FILE=.github/assets/config.playground.yml
            FAVICON=.github/assets/logo.svg
            LOGO=.github/assets/logo.svg
          file: ./playground/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GITHUB_PLAYGROUND_IMAGE_NAME }}:cache

      - name: Scan Albert playground image with Trivy (HIGH — warning)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: HIGH
          exit-code: "0"
          trivyignores: .github/.trivyignore

      - name: Scan Albert playground image with Trivy (CRITICAL — blocking)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          trivyignores: .github/.trivyignore

      - name: Push Albert playground image to GitLab
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            REFLEX_BACKEND_URL=${{ matrix.reflex_url }}
            REFLEX_FRONTEND_URL=${{ matrix.reflex_url }}
            CONFIG_FILE=.github/assets/config.playground.yml
            FAVICON=.github/assets/logo.svg
            LOGO=.github/assets/logo.svg
          file: ./playground/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GITHUB_PLAYGROUND_IMAGE_NAME }}:cache

  tests:
    name: Tests
    if: github.event_name == 'push'
    needs: prepare
    uses: ./.github/workflows/run_tests.yml

  deploy:
    name: Deploy to dev
    if: github.event_name == 'push'
    needs: [ build-opengatellm, build-albert-playground, tests ]
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: sha-${{ github.sha }}
    secrets:
      GITLAB_CI_TOKEN: ${{ secrets.GITLAB_CI_TOKEN }}
      GITLAB_DEPLOY_STATUS_TOKEN: ${{ secrets.GITLAB_DEPLOY_STATUS_TOKEN }}
