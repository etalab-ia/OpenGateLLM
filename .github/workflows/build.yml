name: Build and scan images

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
     - main
  release:
    types:
      - published
      - edited
  workflow_dispatch:

env:
  # Tag rules of docker/metadata-action, shared by every image of this workflow:
  #   push to main, manual run → latest
  #   pull request             → the branch name (sanitized by the action)
  #   release                  → the release tag
  #   push to main, release    → sha-<full commit SHA>, the immutable tag deploy.yml deploys
  IMAGE_TAGS: |
    type=raw,value=latest,enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    type=raw,value=${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' }}
    type=ref,event=tag
    type=sha,format=long,enable=${{ github.event_name == 'push' || github.event_name == 'release' }}
  # The images of a pull request are built from its head commit, not from the merge commit: label them with it.
  DOCKER_METADATA_PR_HEAD_SHA: true

jobs:
  prepare:
    name: Prepare build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'build-approval' || 'build-auto' }}
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Determine image tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          tags: ${{ env.IMAGE_TAGS }}
          flavor: latest=false

  build-opengatellm-api:
    name: Build and push OpenGateLLM API image
    runs-on: ubuntu-latest
    needs: prepare
    env:
      API_IMAGE_NAME: ghcr.io/etalab-ia/opengatellm/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.API_IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAGS }}
          flavor: latest=false

      - name: Build and push OpenGateLLM API image to GitHub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          build-args: BUILD_TARGET=api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.API_IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.API_IMAGE_NAME }}:cache,mode=max

  build-opengatellm-playground:
    name: Build and push OpenGateLLM playground image
    runs-on: ubuntu-latest
    needs: prepare
    env:
      GITHUB_PLAYGROUND_IMAGE_NAME: ghcr.io/etalab-ia/opengatellm/playground
      GITLAB_PLAYGROUND_IMAGE_NAME: registry.gitlab.com/${{ secrets.GITLAB_PROJECT_PATH }}/playground
      PLAYGROUND_URL: https://albert.playground.env.etalab.gouv.fr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GITHUB_PLAYGROUND_IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAGS }}
          flavor: latest=false

      - name: Build and push OpenGateLLM playground image to GitHub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./playground/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GITHUB_PLAYGROUND_IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.GITHUB_PLAYGROUND_IMAGE_NAME }}:cache,mode=max

  build-albert-playground:
    name: Build and push Albert playground image
    runs-on: ubuntu-latest
    needs: prepare
    env:
      GITHUB_PLAYGROUND_IMAGE_NAME: ghcr.io/etalab-ia/opengatellm/playground
      GITLAB_PLAYGROUND_IMAGE_NAME: registry.gitlab.com/${{ secrets.GITLAB_PROJECT_PATH }}/playground
    strategy:
      matrix:
        environment: [dev, staging, prod]
        include:
          - environment: dev
            public_host: albert.playground.dev.etalab.gouv.fr
            private_host: albert.api.001.dev.etalab.gouv.fr:8002
          - environment: staging
            public_host: albert.playground.staging.etalab.gouv.fr
            private_host: albert.api.001.staging.etalab.gouv.fr:8002
          - environment: prod
            public_host: albert.playground.etalab.gouv.fr
            private_host: albert.api.001.prod.etalab.gouv.fr:8002

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log in to GitLab Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_USERNAME }}
          password: ${{ secrets.GITLAB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decrypt playground config
        uses: taichunmin/github-actions-ansible-vault@v1
        with:
          vault_key: ${{ secrets.VAULT_KEY }}
          command: |
            ansible-vault decrypt .github/assets/config.playground.yml.j2

      - name: Render public playground config
        uses: cuchi/jinja2-action@v1.3.0
        with:
          template: .github/assets/config.playground.yml.j2
          output_file: .github/assets/config.playground.yml
          strict: true
          variables: |
            playground_type=public
            playground_host=${{ matrix.public_host }}
            auth_sso_client_secret=${{ secrets.AUTH_SSO_CLIENT_SECRET }}

      - name: Compute public image tags and labels
        id: meta_public
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GITLAB_PLAYGROUND_IMAGE_NAME }}/${{ matrix.environment }}
          tags: ${{ env.IMAGE_TAGS }}
          flavor: latest=false

      - name: Build and push Albert public playground images to GitLab
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            REFLEX_BACKEND_URL=https://${{ matrix.public_host }}
            REFLEX_FRONTEND_URL=https://${{ matrix.public_host }}
            CONFIG_FILE=.github/assets/config.playground.yml
            FAVICON=.github/assets/logo.svg
            LOGO=.github/assets/logo.svg
          file: ./playground/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_public.outputs.tags }}
          labels: ${{ steps.meta_public.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GITHUB_PLAYGROUND_IMAGE_NAME }}:cache

      - name: Render private playground config
        uses: cuchi/jinja2-action@v1.3.0
        with:
          template: .github/assets/config.playground.yml.j2
          output_file: .github/assets/config.playground.yml
          strict: true
          variables: |
            playground_host=${{ matrix.public_host }}
            playground_type=private
            auth_sso_client_secret=${{ secrets.AUTH_SSO_CLIENT_SECRET }}

      - name: Compute private image tags and labels
        id: meta_private
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GITLAB_PLAYGROUND_IMAGE_NAME }}/${{ matrix.environment }}
          tags: ${{ env.IMAGE_TAGS }}
          flavor: |
            latest=false
            suffix=.private,onlatest=true

      - name: Build and push Albert private playground images to GitLab
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            REFLEX_BACKEND_URL=http://${{ matrix.private_host }}
            REFLEX_FRONTEND_URL=http://${{ matrix.private_host }}
            CONFIG_FILE=.github/assets/config.playground.yml
            FAVICON=.github/assets/logo.svg
            LOGO=.github/assets/logo.svg
          file: ./playground/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_private.outputs.tags }}
          labels: ${{ steps.meta_private.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GITHUB_PLAYGROUND_IMAGE_NAME }}:cache

  trivy-scan-api:
    name: Trivy scan — API
    needs: [ prepare, build-opengatellm-api ]
    uses: ./.github/workflows/trivy-scan.yml
    with:
      image-name: ghcr.io/etalab-ia/opengatellm/api
      image-tag: ${{ needs.prepare.outputs.image_tag }}

  trivy-scan-playground:
    name: Trivy scan — Playground
    needs: [ prepare, build-opengatellm-playground ]
    uses: ./.github/workflows/trivy-scan.yml
    with:
      image-name: ghcr.io/etalab-ia/opengatellm/playground
      image-tag: ${{ needs.prepare.outputs.image_tag }}
