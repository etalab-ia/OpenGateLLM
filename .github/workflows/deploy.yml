name: Deploy

on:
  workflow_call:
    inputs:
      commit_title:
        description: "Title of the commit that triggered the build, used for the GitLab pipeline name"
        required: true
        type: string
      environment:
        description: "Deployment environment"
        required: false
        type: string
        default: dev
    secrets:
      GITLAB_CI_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      commit_title:
        description: "Title of the commit that triggered the build, used for the GitLab pipeline name"
        required: false
        type: string
        default: manual
      environment:
        description: "Deployment environment"
        required: false
        type: string
        default: dev

jobs:
  deploy-dev:
    name: Deploy from ${{ github.ref_name }}/${{ github.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger dev deployment
        env:
          GITLAB_CI_TOKEN: ${{ secrets.GITLAB_CI_TOKEN }}
          PIPELINE_NAME: ${{ github.event.repository.name }} - ${{ inputs.commit_title }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          RESPONSE="$(curl --request POST \
            --form token="$GITLAB_CI_TOKEN" \
            --form ref=main \
            --form "variables[pipeline_name]=$PIPELINE_NAME" \
            --form 'variables[docker_image_tag]=latest' \
            --form 'variables[application_to_deploy]=albert-api' \
            --form "variables[deployment_environment]=$DEPLOYMENT_ENVIRONMENT" \
            'https://gitlab.com/api/v4/projects/58117805/trigger/pipeline')"

          if echo "$RESPONSE" | grep -q '"status":"created"'; then
            echo $RESPONSE
          else
            echo $RESPONSE
            exit 1
          fi
