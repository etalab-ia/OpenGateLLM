name: Deploy

on:
  workflow_run:
    workflows: ["Build and scan images"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy to dev: sha-<commit> to deploy or roll back to a given commit, or a release tag"
        required: true
        type: string

permissions: {}

jobs:
  deploy-dev:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.actor.login != 'github-actions[bot]'
      )
    name: Deploy ${{ inputs.image_tag || format('sha-{0}', github.event.workflow_run.head_sha) }} to dev
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Trigger GitLab dev deployment
        env:
          GITLAB_CI_TOKEN: ${{ secrets.GITLAB_CI_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          ACTOR: ${{ github.actor }}
          DOCKER_IMAGE_TAG: ${{ inputs.image_tag || format('sha-{0}', github.event.workflow_run.head_sha) }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TITLE="manual deployment of $DOCKER_IMAGE_TAG by $ACTOR"
          else
            TITLE="$(echo "$HEAD_COMMIT_MESSAGE" | head -n 1)"
          fi

          if ! RESPONSE="$(curl --fail-with-body --silent --show-error --request POST \
            --form token="$GITLAB_CI_TOKEN" \
            --form ref=main \
            --form "variables[pipeline_name]=$REPOSITORY_NAME - $TITLE" \
            --form "variables[docker_image_tag]=$DOCKER_IMAGE_TAG" \
            --form 'variables[application_to_deploy]=albert-api' \
            --form 'variables[deployment_environment]=dev' \
            'https://gitlab.com/api/v4/projects/58117805/trigger/pipeline')"; then
            echo "$RESPONSE"
            exit 1
          fi

          echo "$RESPONSE"
          jq -e '.status == "created"' <<< "$RESPONSE" > /dev/null
          echo "GitLab deployment pipeline: $(jq -r '.web_url' <<< "$RESPONSE")" >> "$GITHUB_STEP_SUMMARY"
