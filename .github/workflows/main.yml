name: Main

on:
  push:
    branches: [ main ]

jobs:
  build-opengatellm:
    name: OpenGateLLM images
    uses: ./.github/workflows/_build_opengatellm.yml
    with:
      tags: |
        type=raw,value=latest
        type=sha,format=long
      push: true

  tests:
    name: Tests
    uses: ./.github/workflows/_run_tests.yml

  coverage:
    name: Coverage
    needs: tests
    permissions:
      contents: write
    uses: ./.github/workflows/_coverage.yml

  semgrep:
    name: Semgrep
    uses: ./.github/workflows/_semgrep.yml
    with:
      scan: full
