name: Semgrep

on:
  workflow_call:
    inputs:
      scan:
        description: "diff: the files changed by the pull request, full: the whole repository"
        required: true
        type: string

jobs:
  semgrep:
    name: Semgrep SAST (${{ inputs.scan }})
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep (diff only)
        if: inputs.scan == 'diff'
        run: semgrep ci --config auto --verbose

      - name: Run Semgrep (WARNING severity)
        if: inputs.scan == 'full'
        run: |
          semgrep scan \
            --config auto \
            --config p/default \
            --config p/secrets \
            --config p/security-audit \
            --config .github/semgrep-rules.yml \
            --severity WARNING \
            --verbose
          exit 0  # Never block this job

      - name: Run Semgrep (ERROR severity only)
        if: inputs.scan == 'full'
        run: |
          semgrep scan \
            --config auto \
            --config p/default \
            --config p/secrets \
            --config p/security-audit \
            --config .github/semgrep-rules.yml \
            --severity ERROR \
            --error \
            --verbose
