name: Semgrep

on:
  workflow_call:
  workflow_dispatch:

jobs:
  semgrep-diff:
    name: Semgrep SAST (diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep (diff only)
        run: semgrep ci --config auto --verbose

  semgrep-full:
    name: Semgrep SAST (full)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep (WARNING severity)
        run: |
          semgrep scan \
            --config auto \
            --config p/default \
            --config p/secrets \
            --config p/security-audit \
            --config .github/semgrep-rules.yml \
            --severity WARNING \
            --verbose
          exit 0  # Never block this job

      - name: Run Semgrep (ERROR severity only)
        run: |
          semgrep scan \
            --config auto \
            --config p/default \
            --config p/secrets \
            --config p/security-audit \
            --config .github/semgrep-rules.yml \
            --severity ERROR \
            --error \
            --verbose
