name: Pull request

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  build-opengatellm:
    name: OpenGateLLM images
    uses: ./.github/workflows/_build_opengatellm.yml
    with:
      tags: type=ref,event=pr
      push: false

  tests:
    name: Tests
    uses: ./.github/workflows/_run_tests.yml

  lint-migrations:
    name: Migrations
    uses: ./.github/workflows/_lint_migrations.yml

  semgrep:
    name: Semgrep
    uses: ./.github/workflows/_semgrep.yml
    with:
      scan: diff
