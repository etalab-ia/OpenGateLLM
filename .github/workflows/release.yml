name: Release

on:
  release:
    types: [ published, edited ]

jobs:
  build-opengatellm:
    name: OpenGateLLM images
    uses: ./.github/workflows/_build_opengatellm.yml
    with:
      tags: |
        type=ref,event=tag
        type=sha,format=long
      push: true

  semgrep:
    name: Semgrep
    uses: ./.github/workflows/_semgrep.yml
    with:
      scan: full

  release-updates:
    name: Release updates
    needs: [ build-opengatellm ]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_release_updates.yml

  deploy-documentation:
    name: Deploy documentation
    needs: [ build-opengatellm ]
    permissions:
      contents: write
    uses: ./.github/workflows/_deploy_documentation.yml
