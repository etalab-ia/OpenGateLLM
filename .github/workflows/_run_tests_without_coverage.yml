name: Tests

on:
  workflow_call:

jobs:
  lockfile:
    name: Lockfile is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test dependencies
        uses: ./.github/actions/test-dependencies

      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest -s api/tests/unit --config-file=pyproject.toml

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test dependencies
        uses: ./.github/actions/test-dependencies

      - name: Set up Docker Compose
        run: |
          docker compose --file compose.example.yml up --detach --quiet-pull --wait postgres redis

      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest api/tests/integration --config-file=pyproject.toml -n 4
