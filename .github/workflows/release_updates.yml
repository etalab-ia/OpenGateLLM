name: Release updates

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  release_updates:
    runs-on: ubuntu-latest

    steps:
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          fetch-depth: 0

      - name: Update project version
        run: |
          git fetch --tags --force
          latest_version="$(git tag --sort=-version:refname | head -n 1)"
          if [ -z "$latest_version" ]; then
            echo "No git tags found. Skipping project version update."
            exit 0
          fi
          sed -i -E "s/^[[:space:]]*version[[:space:]]*=.*/version = \"${latest_version}\"/" pyproject.toml
          sed -i -E "s/^[[:space:]]*swagger_version:[[:space:]]*.*/  swagger_version: ${latest_version}/" config.example.yml
          sed -i -E "s/(badge:[[:space:]]*)'[^']*'/\1'v${latest_version}'/" docs/astro.config.mjs
      
      - name: Generate documentation
        env:
          DOCS_DIR: ${{ github.workspace }}/docs
          CONFIG_FILE: ${{ github.workspace }}/config.example.yml
        run: |
          uv venv
          uv pip install --quiet -p .venv/bin/python ".[api,playground,dev]"
          . .venv/bin/activate
          PYTHONPATH=. python ./scripts/docs/generate_configuration_documentation.py --output ./docs/src/content/docs/configuration/configuration_file.mdx
          if ! docker compose --file ./compose.example.yml up --detach --wait; then
            echo "Services did not become healthy." >&2
            echo "::group::Docker Compose status"
            docker compose --file ./compose.example.yml ps || true
            echo "::endgroup::"

            echo "::group::Docker Compose logs (all services)"
            docker compose --file ./compose.example.yml logs --no-color || true
            echo "::endgroup::"

            echo "::group::API health probe"
            curl -sv "http://localhost:8000/health" || true
            echo "::endgroup::"
            exit 1
          fi
          curl -fSL --retry 8 --retry-all-errors --retry-delay 2 http://localhost:8000/openapi.json -o ./docs/openapi.json
          docker pull redocly/cli:2.57.0@sha256:e320090ecd380878ff2aa671a928d5ac28fcbb7bb6230250d772790811125aea
          docker run --rm -v "$DOCS_DIR:/spec" redocly/cli:2.57.0@sha256:e320090ecd380878ff2aa671a928d5ac28fcbb7bb6230250d772790811125aea build-docs /spec/openapi.json --output /spec/redoc-static.html

      - name: Create pull request for release updates
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(doc): update generated documentation and release versions"
          title: "chore(doc): update generated documentation and release versions"
          body: |
            Automated documentation and release version update after the release images were built by the Pipeline workflow.
          branch: "ci/release-update-${{ github.run_id }}"
          base: "main"
          delete-branch: true
          add-paths: |
            docs/src/content/docs/configuration/configuration_file.mdx
            docs/openapi.json
            docs/redoc-static.html
            docs/astro.config.mjs
            compose.example.yml
            pyproject.toml
            config.example.yml