name: Testing

# PR targeting main:
#   draft  → unit + integration
#   ready  → unit & integration (coverage + badge commit) + e2e
# workflow_call / workflow_dispatch → all jobs; unit with coverage (badge commit only on a ready PR to main)

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "api/**"
      - ".github/workflows/run_tests.yml"
  workflow_call: # Add this to make the workflow reusable
  workflow_dispatch: # Add this to allow manual triggering

jobs:
  unit-tests:
    name: Unit tests
    if: >-
      github.event_name == 'workflow_call' ||
      github.event_name == 'workflow_dispatch' ||
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Docker Compose
        run: |
          cp config.example.yml config.yml

      - name: Install test dependencies
        run: |
          uv venv
          uv pip install --quiet -p .venv/bin/python ".[api,dev,test]"

      - name: Run unit tests
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          . .venv/bin/activate
          pytest -s api/tests/unit --config-file=pyproject.toml

  integration-tests:
    name: Integration tests
    if: >-
      github.event_name == 'workflow_call' ||
      github.event_name == 'workflow_dispatch' ||
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Run integration tests
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          # Create a local virtual environment and install dependencies
          uv venv
          uv pip install --quiet -p .venv/bin/python ".[api,dev,test]"

          # Activate venv for the test run
          . .venv/bin/activate

          docker compose --file compose.example.yml up --detach --quiet-pull --wait postgres redis

          # Run integration tests
          CONFIG_FILE=./config.example.yml pytest api/tests/integration --config-file=pyproject.toml

          docker compose --file compose.example.yml down --volumes --remove-orphans

  coverage-badge:
    name: Coverage badge
    if: >-
      github.event_name == 'workflow_call' ||
      github.event_name == 'workflow_dispatch' ||
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Run tests (unit & integration) with coverage and publish unit badge
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: |
          # Create a local virtual environment and install dependencies
          uv venv
          uv pip install --quiet -p .venv/bin/python ".[api,dev,test]"

          # Activate venv for the test run
          . .venv/bin/activate

          docker compose --file compose.example.yml up --detach --quiet-pull --wait postgres redis

          # Run unit & integration tests with coverage
          pytest -s api/tests/unit api/tests/integration --config-file=pyproject.toml --cov=./api --cov-report=html --cov-report=term-missing --cov-branch --cov-report=xml

          # Export coverage data to XML for badge computation
          python -m coverage xml -o coverage.xml

          # Build unit coverage badge JSON
          mkdir -p .github/badges
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          coverage = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          coverage_pct = f"{coverage * 100:.2f}"
          if float(coverage_pct) >= 80:
              color = "green"
          elif float(coverage_pct) >= 70:
              color = "yellow"
          else:
              color = "red"

          badge = {
              "schemaVersion": 1,
              "label": "coverage",
              "message": f"{coverage_pct}%",
              "color": color,
          }
          with open(".github/badges/coverage.json", "w", encoding="utf-8") as badge_file:
              json.dump(badge, badge_file)
          PY

      - name: Commit unit coverage badge
        if: >-
          github.event.pull_request.draft == false &&
          github.event.pull_request.base.ref == 'main'
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Update unit coverage badge
          file_pattern: .github/badges/coverage.json
          commit_user_name: "GitHub Actions"
          commit_user_email: "actions@github.com"

  e2e-tests:
    name: e2e tests
    if: >-
      github.event_name == 'workflow_call' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.actor != 'github-actions[bot]' &&
        github.event.pull_request.draft == false
      )
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

    - name: Run integration tests
      run: |
        # Create a local virtual environment and install dependencies
        uv venv
        uv pip install --quiet -p .venv/bin/python ".[api,dev,test]"

        # Activate venv for the test run
        . .venv/bin/activate

        # Start dependencies services
        docker compose --file compose.example.yml up --detach --quiet-pull --wait postgres redis

        # Run integration tests
        PYTHONPATH=. pytest api/tests/integ --config-file=pyproject.toml --cov=./api --cov-report=xml
      env:
        CONFIG_FILE: ./api/tests/integ/config.test.yml
        ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
