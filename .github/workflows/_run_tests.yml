name: Tests

on:
  workflow_call:
    inputs:
      commit_coverage:
        description: "Commit the coverage badge to the pull request branch"
        required: true
        type: boolean

jobs:
  lockfile:
    name: Lockfile is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install test dependencies
        uses: ./.github/actions/test-dependencies

      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest -s api/tests/unit --config-file=pyproject.toml --cov=./api --cov-report=
          mv .coverage .coverage.unit

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          retention-days: 1

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install test dependencies
        uses: ./.github/actions/test-dependencies

      - name: Set up Docker Compose
        run: |
          docker compose --file compose.example.yml up --detach --quiet-pull --wait postgres redis

      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest api/tests/integration --config-file=pyproject.toml -n 4 --cov=./api --cov-report=
          mv .coverage .coverage.integration

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          retention-days: 1

  coverage:
    name: Coverage
    needs: [ unit-tests, integration-tests ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: ${{ inputs.commit_coverage && github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Install test dependencies
        uses: ./.github/actions/test-dependencies

      - name: Download coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine the unit and integration coverage
        run: |
          . .venv/bin/activate
          coverage combine .coverage.unit .coverage.integration
          coverage report
          coverage xml

      - name: Build coverage badge from coverage.xml
        if: inputs.commit_coverage
        run: |
          mkdir -p .github/badges
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          coverage = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          coverage_pct = f"{coverage * 100:.2f}"
          if float(coverage_pct) >= 80:
              color = "green"
          elif float(coverage_pct) >= 70:
              color = "yellow"
          else:
              color = "red"

          badge = {
              "schemaVersion": 1,
              "label": "coverage",
              "message": f"{coverage_pct}%",
              "color": color,
          }
          with open(".github/badges/coverage.json", "w", encoding="utf-8") as badge_file:
              json.dump(badge, badge_file)
          PY

      - name: Commit tests coverage badge
        if: inputs.commit_coverage && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: "chore(tests): update tests coverage badge"
          file_pattern: .github/badges/coverage.json
          branch: ${{ github.head_ref }}
          commit_user_name: "GitHub Actions"
          commit_user_email: "actions@github.com"
