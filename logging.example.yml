# Logging configuration for the API process, used when settings.log_config points to this file.
# Schema: https://docs.python.org/3/library/logging.config.html#logging-config-dictschema
# It reproduces the default behaviour. When it is set, settings.log_level no longer applies: levels are decided here.
# Uncomment a block by removing the leading '#' only, not the space after it.

version: 1
disable_existing_loggers: false

formatters:
  json:
    (): api.infrastructure.logging.JsonFormatter

filters:
  request_id:
    (): api.infrastructure.logging.RequestIdFilter

handlers:
  stdout:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: json
    filters: [request_id]

# Everything else, so no library falls back to the default stderr handler in plain text.
root:
  level: WARNING
  handlers: [stdout]

loggers:
  api:
    level: INFO
    handlers: [stdout]
    propagate: false

  uvicorn:
    level: INFO
    handlers: [stdout]
    propagate: false

  # Declared on its own: under gunicorn, UvicornWorker attaches gunicorn's handlers to it directly.
  uvicorn.error:
    level: INFO
    handlers: [stdout]
    propagate: false

  # No handler on purpose: the api.request line replaces it, with the user, the handler and the duration it lacks.
  uvicorn.access:
    level: WARNING
    handlers: []
    propagate: false

