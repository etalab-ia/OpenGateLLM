version: 1
disable_existing_loggers: false

formatters:
  json:
    (): api.infrastructure.logging.JsonFormatter

filters:
  request_id:
    (): api.infrastructure.logging.RequestIdFilter

handlers:
  stdout:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: json
    filters: [request_id]

loggers:
  api:
    level: INFO
    handlers: [stdout]
    propagate: false

  uvicorn:
    level: INFO
    handlers: [stdout]
    propagate: false

  uvicorn.error:
    level: INFO
    handlers: [stdout]
    propagate: false

  uvicorn.access:
    level: WARNING
    handlers: []
    propagate: false
